<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Perfil — Vai Ter Forró!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="components/modal-login.css">
<link rel="stylesheet" href="css/perfil-visualizar.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#142F26">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">
<link rel="icon" href="assets/icons/favicon-32.png" type="image/png">
</head>
<body>
<script src="js/barraTopo.js"></script>

<main class="container">
  <header class="cabecalho">
    <p class="rotulo-eyebrow">Meu Perfil</p>
    <h1 style="font-size: var(--tam-titulo-lg);">Seu perfil</h1>
  </header>

  <!-- Estado: não logado -->
  <section class="secao" id="perfil-bloqueado" hidden>
    <p class="texto-suave">Entre com sua conta pra ver seu perfil.</p>
    <button type="button" class="botao botao-primario" id="perfil-botao-entrar" style="margin-top: var(--esp-md);">
      Entrar
    </button>
  </section>

  <!-- Estado: carregando -->
  <section class="secao" id="perfil-carregando">
    <p class="texto-suave">Carregando...</p>
  </section>

  <!-- Estado: visualização -->
  <section class="secao perfil-card" id="perfil-visualizacao" hidden>
    <img id="perfil-avatar" class="perfil-card-avatar" src="" alt="Sua foto de perfil">
    <h2 class="perfil-card-nome" id="perfil-card-apelido">Forrozeiro</h2>
    <p class="perfil-card-nome-completo" id="perfil-card-nome-completo" hidden></p>

    <p class="perfil-card-bio" id="perfil-card-bio" hidden></p>

    <dl class="perfil-card-lista" id="perfil-card-lista">
      <div class="perfil-card-item" id="item-localizacao" hidden>
        <dt>Localização</dt>
        <dd id="valor-localizacao"></dd>
      </div>
      <div class="perfil-card-item" id="item-instagram" hidden>
        <dt>Instagram</dt>
        <dd><a id="valor-instagram" href="#" target="_blank" rel="noopener"></a></dd>
      </div>
      <div class="perfil-card-item" id="item-whatsapp" hidden>
        <dt>WhatsApp</dt>
        <dd id="valor-whatsapp"></dd>
      </div>
      <div class="perfil-card-item" id="item-nascimento" hidden>
        <dt>Data de nascimento</dt>
        <dd id="valor-nascimento"></dd>
      </div>
      <div class="perfil-card-item" id="item-genero" hidden>
        <dt>Gênero</dt>
        <dd id="valor-genero"></dd>
      </div>
      <div class="perfil-card-item">
        <dt>E-mail</dt>
        <dd id="valor-email"></dd>
      </div>
    </dl>

    <a href="perfil-editar.html" class="botao botao-primario perfil-card-botao-editar">Editar perfil</a>
  </section>
</main>

<script src="js/pwa.js"></script>
<script type="module" src="js/pages/perfil.js"></script>
</body>
</html>
