<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Perfil — Vai Ter Forró!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="components/modal-login.css">
<link rel="stylesheet" href="css/perfil-visualizar.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#142F26">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">
<link rel="icon" href="assets/icons/favicon-32.png" type="image/png">
</head>
<body>
<script src="js/barraTopo.js"></script>

<main class="container">
  <header class="cabecalho">
    <p class="rotulo-eyebrow">Meu Perfil</p>
    <h1 style="font-size: var(--tam-titulo-lg);">Seu perfil</h1>
  </header>

  <!-- Estado: não logado -->
  <section class="secao" id="perfil-bloqueado" hidden>
    <p class="texto-suave">Entre com sua conta pra ver seu perfil.</p>
    <button type="button" class="botao botao-primario" id="perfil-botao-entrar" style="margin-top: var(--esp-md);">
      Entrar
    </button>
  </section>

  <!-- Estado: carregando -->
  <section class="secao" id="perfil-carregando">
    <p class="texto-suave">Carregando...</p>
  </section>

  <!-- Estado: visualização -->
  <section class="secao perfil-card" id="perfil-visualizacao" hidden>
    <img id="perfil-avatar" class="perfil-card-avatar" src="" alt="Sua foto de perfil">
    <h2 class="perfil-card-nome" id="perfil-card-apelido">Forrozeiro</h2>
    <p class="perfil-card-nome-completo" id="perfil-card-nome-completo" hidden></p>

    <p class="perfil-card-bio" id="perfil-card-bio" hidden></p>

    <div class="perfil-card-local" id="item-localizacao" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span id="valor-localizacao"></span>
    </div>

    <div class="perfil-card-chips">
      <a class="perfil-chip" id="item-instagram" href="#" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/></svg>
        <span id="valor-instagram"></span>
      </a>
      <a class="perfil-chip" id="item-whatsapp" href="#" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-2.9-.4-4.1-1.1L3 21l1.9-5.1A8.4 8.4 0 0 1 3.5 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5z"/></svg>
        <span id="valor-whatsapp"></span>
      </a>
    </div>

    <div class="perfil-card-detalhes" id="perfil-card-lista">
      <div class="perfil-card-detalhe" id="item-nascimento" hidden>
        <dt>Nascimento</dt>
        <dd id="valor-nascimento"></dd>
      </div>
      <div class="perfil-card-detalhe" id="item-genero" hidden>
        <dt>Gênero</dt>
        <dd id="valor-genero"></dd>
      </div>
    </div>

    <p class="perfil-card-email"><span id="valor-email"></span></p>

    <a href="perfil-editar.html" class="botao botao-primario perfil-card-botao-editar">Editar perfil</a>
  </section>
</main>

<script src="js/pwa.js"></script>
<script type="module" src="js/pages/perfil.js"></script>
</body>
</html>
