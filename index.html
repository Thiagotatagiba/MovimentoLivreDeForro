<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vai Ter Forró! — Onde tem forró hoje</title>
<meta name="description" content="Descubra bailes de forró pé de serra na Grande Vitória: Marcas, Locais e a agenda completa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="components/modal-login.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#142F26">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">
<link rel="icon" href="assets/icons/favicon-32.png" type="image/png">
</head>
<body data-busca-topo>
<script src="js/barraTopo.js"></script>

<main class="container">
  <header class="cabecalho">
    <div>
      <h1 class="somente-leitor">Vai Ter Forró! — Home</h1>
      <p class="localizacao">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        Grande Vitória
      </p>
    </div>

    <div id="busca-container" class="busca-container" hidden>
      <div class="busca">
        <label for="campo-busca" class="somente-leitor">Pesquisar Marcas, Locais ou eventos</label>
        <input id="campo-busca" type="search" placeholder="Buscar Marca, Local ou evento...">
      </div>
    </div>
  </header>

  <section class="secao secao-dias">
    <div class="tira-dias">
      <button type="button" class="seta-tira" id="seta-esquerda" hidden aria-label="Ver dias anteriores">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div id="cards-semana" class="cards-semana" role="list" aria-label="Dias da semana"></div>
      <button type="button" class="controle-direita" id="controle-direita" aria-label="Ver próximos dias">
        <span class="controle-direita-texto" hidden>Ver mais</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </section>

  <section class="secao secao-proximos">
    <h2 id="titulo-secao-eventos">Próximos bailes</h2>
    <div id="grade-proximos" class="grade-eventos"></div>
    <div style="margin-top: var(--esp-lg);">
      <a class="botao botao-secundario" href="agenda.html">Ver agenda completa</a>
    </div>
  </section>
</main>

<div class="story-viewer" id="story-viewer" hidden role="dialog" aria-modal="true" aria-label="Eventos do dia">
  <div class="story-progress" id="story-progress"></div>
  <button type="button" class="story-fechar" id="story-fechar" aria-label="Fechar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="story-conteudo" id="story-conteudo"></div>
</div>

<script src="js/pwa.js"></script>
<script type="module" src="js/pages/home.js"></script>
</body>
</html>
